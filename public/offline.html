<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Offline · Study Planner</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #faf7f2;
        color: #2b2437;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #ece6de;
        border-radius: 28px;
        padding: 36px 26px;
        box-shadow: 0 10px 30px -18px rgba(63, 42, 94, 0.35);
      }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 18px;
        overflow: hidden;
        border-radius: 22px;
        background: #ede5ff;
      }
      .icon img {
        display: block;
        width: 100%; height: 100%;
        object-fit: cover;
      }
      h1 { font-family: Georgia, "Playfair Display", serif; font-size: 28px; margin: 0 0 8px; }
      p { color: #7a7288; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
      a {
        display: inline-flex; align-items: center; justify-content: center;
        height: 44px; padding: 0 24px; border-radius: 999px;
        background: #7c3aed; color: #fff; text-decoration: none;
        font-size: 14px; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon"><img src="/icons/icon-192x192.png" alt="" /></div>
      <h1>Você está offline</h1>
      <p>
        Seus dados salvos continuam disponíveis nas telas já visitadas e as alterações serão
        sincronizadas quando a conexão voltar.
      </p>
      <a href="/dashboard">Tentar novamente</a>
    </main>
  </body>
</html>
